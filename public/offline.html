<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c398e" />
    <title>Offline · Project Expense Manager</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { color: #475569; line-height: 1.5; margin: 0 0 1rem; }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #1c398e;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.75rem 1.5rem;
        width: 100%;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #f1f5f9; }
        p { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Inline, so it shows without a connection -->
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#2b7fff" />
        <g transform="translate(14 14) scale(1.5)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5" /><path d="M14 6a6 6 0 0 1 6 6v3" /><path d="M4 15v-3a6 6 0 0 1 6-6" />
          <rect x="2" y="15" width="20" height="4" rx="1" />
        </g>
      </svg>
      <h1>You&rsquo;re offline</h1>
      <p>
        This page needs an internet connection. Expenses and receipts are saved straight to the office system, so they
        can only be entered while you&rsquo;re connected.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Reload automatically when the connection comes back
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
